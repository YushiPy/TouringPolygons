[project]
name = "tpp-benchmark-dashboard"
version = "0.1.0"
description = "Local dashboard for Touring Polygons benchmark campaigns."
requires-python = ">=3.12"
dependencies = [
	"fastapi",
	"jinja2",
	"matplotlib>=3.11.1",
	"osmium>=4.3.1",
	"python-multipart",
	"shapely>=2.1.2",
	"uvicorn",
]

[dependency-groups]
dev = [
	"ruff",
]

[tool.uv]
package = false
