<section id="cases-panel" class="panel">
  <div class="panel-header">
    <h2>Edit Instances</h2>
    <p>Create or open benchmark campaigns and edit their instances directly.</p>
  </div>
  <div class="case-editor-shell">
    <aside class="case-sidebar">
      <form id="manual-campaign-form" class="manual-campaign-form">
        <label>
          New campaign
          <input id="manual-campaign-name" name="name" value="manual">
        </label>
        <button type="submit">Create</button>
      </form>
      <div class="field">
        <span class="field-label">Campaigns</span>
        <div id="manual-campaign-grid" class="choice-grid manual-campaign-grid" role="listbox" aria-label="Editable campaigns"></div>
      </div>
      <div class="case-list-head">
        <h3>Instances</h3>
        <button id="new-manual-case" class="secondary" type="button">New</button>
      </div>
      <div id="manual-case-list" class="manual-case-list"></div>
    </aside>
    <section class="case-editor">
      <div class="case-toolbar">
        <div class="segmented case-mode-control" data-manual-mode>
          <button class="segment is-active" data-mode="move" type="button"><span>Move</span><kbd class="keyboard-only">1</kbd></button>
          <button class="segment" data-mode="polygon" type="button"><span>Polygon</span><kbd class="keyboard-only">2</kbd></button>
          <button class="segment" data-mode="select" type="button"><span>Select</span><kbd class="keyboard-only">3</kbd></button>
        </div>
        <button id="close-manual-polygon" class="secondary" type="button" data-tooltip="Needs at least 3 vertices">Close Poly</button>
        <button id="delete-manual-selection" class="danger" type="button">Delete Selection</button>
        <button id="clear-manual-selection" class="secondary" type="button">Clear Selection</button>
        <button id="toggle-manual-snapping" class="secondary" type="button" aria-pressed="false">Snap</button>
        <button id="manual-zoom-out" class="secondary tap-zoom-button" type="button">-</button>
        <button id="manual-zoom-in" class="secondary tap-zoom-button" type="button">+</button>
        <button id="manual-fit-instance" class="secondary" type="button">Fit</button>
        <div class="editor-layer-toggles" aria-label="Editor layers">
          <button class="secondary is-active" data-editor-layer="grid" type="button" aria-pressed="true">Grid</button>
          <button class="secondary is-active" data-editor-layer="solution" type="button" aria-pressed="true">Path</button>
          <button class="secondary is-active" data-editor-layer="decomposition" type="button" aria-pressed="true">Decomp</button>
          <button class="secondary is-active" data-editor-layer="labels" type="button" aria-pressed="true">Labels</button>
        </div>
        <button id="manual-editor-expand" class="secondary" type="button" aria-pressed="false">Expand</button>
        <button id="manual-keybinds-button" class="secondary keyboard-only" type="button">Keyboard Shortcuts</button>
        <button id="manual-editor-close" class="manual-editor-close" type="button" aria-label="Close expanded editor">×</button>
      </div>
      <canvas id="manual-case-canvas" width="960" height="620"></canvas>
      <div id="manual-editor-status" class="editor-status-row">
        <span id="manual-solve-status"></span>
        <span id="manual-save-status"></span>
      </div>
    </section>
  </div>
</section>
