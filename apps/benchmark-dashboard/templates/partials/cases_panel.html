<section id="cases-panel" class="panel is-active">
	<div class="panel-header">
		<h2>Instances</h2>
		<p>Build instances manually, or switch to generated campaigns for reproducible suites.</p>
	</div>
	<div class="instance-workspace-switch" role="group" aria-label="Instance creation method">
		<button class="is-active" type="button" data-instance-workspace-panel="cases-panel" aria-pressed="true"><span>Manual editor</span><small>Draw and refine individual instances</small></button>
		<button type="button" data-instance-workspace-panel="create-panel" aria-pressed="false"><span>Generate campaign</span><small>Synthetic or OSM batch generation</small></button>
	</div>
	<div class="case-editor-shell">
		<aside class="case-sidebar">
			<div class="field">
				<div class="field-label-row">
					<span class="field-label">Campaigns</span>
					<div class="sort-by-control">
						<span>Sort by:</span>
						<div class="segmented list-sort-control" data-campaign-sort="edit" aria-label="Sort campaigns">
							<button class="segment is-active" data-sort="default" type="button">Default</button>
							<button class="segment" data-sort="name" type="button">Name</button>
							<button class="segment" data-sort="count" type="button">Instances</button>
							<button class="segment icon-segment sort-reverse-button" data-sort-reverse type="button" title="Reverse order"
								aria-label="Reverse order" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v15"></path><path d="m3 14 4 4 4-4"></path><path d="M17 21V6"></path><path d="m13 10 4-4 4 4"></path></svg></button>
						</div>
					</div>
				</div>
				<div id="manual-campaign-grid" class="choice-grid manual-campaign-grid" role="listbox"
					aria-label="Editable campaigns"></div>
			</div>
			<div class="case-list-head">
				<h3>Instances</h3>
				<div class="case-list-actions">
					<div class="sort-by-control">
						<span>Sort by:</span>
						<div class="segmented list-sort-control" data-instance-sort aria-label="Sort instances">
							<button class="segment is-active" data-sort="default" type="button">Default</button>
							<button class="segment" data-sort="name" type="button">Name</button>
							<button class="segment" data-sort="count" type="button">Polygon</button>
							<button class="segment icon-segment sort-reverse-button" data-sort-reverse type="button" title="Reverse order"
								aria-label="Reverse order" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v15"></path><path d="m3 14 4 4 4-4"></path><path d="M17 21V6"></path><path d="m13 10 4-4 4 4"></path></svg></button>
						</div>
					</div>
				</div>
			</div>
			<div id="manual-case-list" class="manual-case-list"></div>
		</aside>
		<section class="case-editor">
			<div class="case-toolbar">
				<div class="toolbar-group toolbar-modes">
					<div class="field visit-order-compact">
						<span class="field-label">Visit order</span>
						<input id="manual-visit-order" type="hidden" value="fixed" data-visit-order>
						<div class="segmented visit-order-picker" data-visit-order-picker aria-label="Visit order">
							<button class="segment is-active" data-value="fixed" type="button" aria-pressed="true">Fixed</button>
							<button class="segment" data-value="free" type="button" aria-pressed="false">Free</button>
						</div>
					</div>
					<div class="field">
						<span class="field-label">Tool</span>
						<div class="segmented case-mode-control" data-manual-mode>
							<button class="segment is-active" data-mode="move" type="button"><span>Move</span><kbd class="keyboard-only">1</kbd></button>
							<button class="segment" data-mode="polygon" type="button"><span>Draw</span><kbd class="keyboard-only">2</kbd></button>
							<button class="segment" data-mode="select" type="button"><span>Select</span><kbd class="keyboard-only">3</kbd></button>
						</div>
					</div>
				</div>
				<div class="toolbar-group toolbar-actions-group" aria-label="Geometry actions">
					<span class="toolbar-label">Selection</span>
					<div>
						<button id="close-manual-polygon" class="secondary" type="button" data-tooltip="Needs at least 3 vertices">Close polygon</button>
						<button id="clear-manual-selection" class="secondary" type="button">Clear</button>
						<button id="delete-manual-selection" class="danger subtle-danger" type="button">Delete</button>
					</div>
				</div>
				<div class="toolbar-group toolbar-view-group">
					<span class="toolbar-label">View</span>
					<div>
						<button id="toggle-manual-snapping" class="secondary" type="button" aria-pressed="false">Snap</button>
						<button id="manual-zoom-out" class="secondary tap-zoom-button icon-button" type="button" aria-label="Zoom out">−</button>
						<button id="manual-zoom-in" class="secondary tap-zoom-button icon-button" type="button" aria-label="Zoom in">+</button>
						<button id="manual-fit-instance" class="secondary" type="button">Fit</button>
						<div class="editor-layer-toggles" aria-label="Editor layers">
							<button class="secondary is-active" data-editor-layer="grid" type="button" aria-pressed="true">Grid</button>
							<button class="secondary is-active" data-editor-layer="solution" type="button" aria-pressed="true">Path</button>
							<button class="secondary is-active" data-editor-layer="decomposition" type="button" aria-pressed="true">Pieces</button>
							<button class="secondary is-active" data-editor-layer="labels" type="button" aria-pressed="true">Labels</button>
						</div>
					</div>
				</div>
				<details class="toolbar-more">
					<summary>Background &amp; more <span class="summary-chevron" aria-hidden="true"></span></summary>
					<div class="toolbar-more-content">
						<input id="manual-background-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
						<button id="manual-background-button" class="secondary" type="button">Add background</button>
						<button id="manual-satellite-button" class="secondary" type="button">Satellite map</button>
						<label id="manual-background-opacity-control" class="background-opacity-control is-hidden">Opacity <input id="manual-background-opacity" type="range" min="5" max="100" value="45"></label>
						<button id="manual-refit-background" class="secondary is-hidden" type="button">Align image</button>
						<button id="manual-fit-background" class="secondary is-hidden" type="button">Frame image</button>
						<button id="manual-remove-background" class="secondary is-hidden" type="button">Remove image</button>
						<button id="manual-keybinds-button" class="secondary keyboard-only" type="button">Keyboard shortcuts</button>
					</div>
				</details>
				<button id="manual-editor-expand" class="secondary expand-editor-button" type="button" aria-pressed="false">Focus editor</button>
				<button id="manual-editor-close" class="manual-editor-close" type="button"
					aria-label="Close expanded editor">×</button>
			</div>
			<canvas id="manual-case-canvas" width="960" height="620"></canvas>
			<div id="manual-editor-status" class="editor-status-row">
				<span id="manual-solve-status"></span>
				<span id="manual-save-status"></span>
			</div>
		</section>
	</div>
</section>
