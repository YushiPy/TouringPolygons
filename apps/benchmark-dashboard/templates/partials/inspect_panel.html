<section id="inspect-panel" class="panel">
	<div class="panel-header">
		<h2>Inspect Campaigns</h2>
		<p>Campaign metadata, previews, run progress, and recent result files.</p>
	</div>
	<div class="inspect-actions">
		<div class="sort-by-control"><span>Sort by:</span><div class="segmented list-sort-control" data-campaign-sort="inspect" aria-label="Sort campaigns">
			<button class="segment is-active" data-sort="default" type="button">Default</button><button class="segment" data-sort="name" type="button">Name</button><button class="segment" data-sort="count" type="button">Instances</button>
		</div></div>
		<button id="import-canonical-button" class="secondary" type="button">Import Canonical Suite</button>
		<button id="import-german-button" class="secondary" type="button">Import German Instances</button>
		<label class="toolbar-search">
			<span>Campaign filter</span>
			<input id="campaign-filter" type="search" placeholder="name, type, parameter">
		</label>
	</div>
	<div id="campaign-list" class="campaign-grid"></div>
	<div class="section-title-row">
		<h3>Recent Result Files</h3>
		<label class="toolbar-search">
			<span>Result filter</span>
			<input id="result-filter" type="search" placeholder=".csv, .md, campaign">
		</label>
	</div>
	<div id="result-list" class="result-list"></div>
	<h3>Recent Jobs</h3>
	<div id="job-list" class="result-list"></div>
	<div class="output-panel">
		<pre id="inspect-output" class="output inspect-output" aria-live="polite"></pre>
	</div>
</section>
